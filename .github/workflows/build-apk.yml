
name: Build Likho Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          echo "Searching for project ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 -type f -iname '*.zip' \
            ! -path '*/.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/likho-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/likho-project"

          PROJECT_DIR=$(find "$RUNNER_TEMP/likho-project" \
            -type f -name package.json -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/capacitor.config.json" ]; then
            echo "ERROR: Valid Capacitor project not found."
            find "$RUNNER_TEMP/likho-project" -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/src/native-bridge.js" ] || \
             [ ! -f "$PROJECT_DIR/scripts/patch-android.mjs" ]; then
            echo "ERROR: Required project files are missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found successfully."

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Build native bridge
        run: |
          cd "$PROJECT_DIR"
          npm run build:bridge

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Configure Android file integration
        run: |
          cd "$PROJECT_DIR"
          node scripts/patch-android.mjs

      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Likho-Pro-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
